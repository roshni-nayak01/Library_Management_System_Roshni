<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Borrow Records</title>

    <!-- MAIN CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>


<body>


<!-- =========================================================
     BORROW RECORDS PAGE
========================================================= -->

<div class="borrow-records-page">


    <!-- =====================================================
         MAIN CARD
    ====================================================== -->

    <div class="borrow-records-card">


        <!-- =================================================
             ICON
        ================================================== -->

        <div class="borrow-records-icon">

            <i class="fa-solid fa-file-lines"></i>

        </div>


        <!-- =================================================
             TITLE
        ================================================== -->

        <h2>

            Borrow Records

        </h2>


        <!-- =================================================
             SUBTITLE
        ================================================== -->

        <p class="borrow-records-subtitle">

            View all books that have been borrowed and returned.

        </p>


        <!-- =================================================
             RECORDS TABLE
        ================================================== -->

        <div class="borrow-records-table-container">

            <table class="borrow-records-table">


                <!-- TABLE HEADER -->

                <thead>

                    <tr>

                        <th>
                            Member
                        </th>

                        <th>
                            Book
                        </th>

                        <th>
                            Issue Date
                        </th>

                        <th>
                            Return Date
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                </thead>


                <!-- TABLE BODY -->

                <tbody>


                    <!-- SAMPLE RECORD -->

                    <tr>

                        <td>
                            Roshni
                        </td>

                        <td>
                            Data Structures
                        </td>

                        <td>
                            01-08-2026
                        </td>

                        <td>
                            06-08-2026
                        </td>

                        <td>

                            <span class="borrow-status returned">

                                Returned

                            </span>

                        </td>

                    </tr>


                    <!-- YOU CAN ADD MORE RECORDS HERE -->

                    <tr>

                        <td>
                            Savio
                        </td>

                        <td>
                            Database Management Systems
                        </td>

                        <td>
                            05-08-2026
                        </td>

                        <td>
                            12-08-2026
                        </td>

                        <td>

                            <span class="borrow-status returned">

                                Returned

                            </span>

                        </td>

                    </tr>


                </tbody>

            </table>

        </div>


        <!-- =================================================
             BACK BUTTON
        ================================================== -->

        <div class="borrow-records-back-container">

            <a href="{{ url_for('librarian_dashboard') }}"
               class="borrow-records-back-btn">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Dashboard

            </a>

        </div>


    </div>


</div>


</body>

</html>
