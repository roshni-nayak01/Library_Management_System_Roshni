<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Renew Books</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .renew-container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .renew-card {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .renew-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .renew-header .icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 28px;
        }

        .renew-header h1 {
            margin: 0;
            font-size: 30px;
            color: #222;
        }

        .renew-header p {
            color: #777;
            margin-top: 8px;
        }

        .renew-message {
            padding: 20px;
            border-radius: 12px;
            background: #f5f7ff;
            color: #555;
            text-align: center;
            margin-bottom: 25px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 22px;
            border-radius: 10px;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-weight: 600;
            transition: 0.3s ease;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(102, 126, 234, 0.3);
        }

        .button-area {
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="renew-container">

        <div class="renew-card">

            <div class="renew-header">

                <div class="icon">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </div>

                <h1>Renew Books</h1>

                <p>
                    Renew your borrowed books and extend the return period.
                </p>

            </div>

            <div class="renew-message">
                <i class="fa-solid fa-book"></i>

                <p>
                    Your borrowed books will appear here for renewal.
                </p>
            </div>

            <div class="button-area">

                <!-- IMPORTANT:
                     This goes back to the correct dashboard
                     according to the logged-in user's role.
                -->
                <a href="{{ dashboard_url }}" class="back-btn">

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Dashboard

                </a>

            </div>

        </div>

    </div>

</body>
</html>
